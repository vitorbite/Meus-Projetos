<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relógio</title>
    <link rel="icon" type="image/png" sizes="16x16" href="clock-removebg.png">
    <link rel="stylesheet" href="assets/style.css">
</head>

<body>
    <div class="container">
        <div class="relogio">
            <div class="horas">
                <img src="Images/Ponteiro1.png" id="hand1">
                <img src="Images/Ponteiro2.png" id="hand2">
                <img src="Ponteiro3.png" id="hand3">
            </div>
        </div>
        <button class="button">Cronômetro</button>
        <div class="digital"><span class="timer" id="timer">00:00</span></div>
        <div id="buttons">
            <button class="hidden1" onclick="start()">Start</button>
            <button class="hidden2" onclick="stop()">Stop</button>
            <button class="hidden3" onclick="Reset()">Reset</button>
        </div>
    </div>

    <script src="assets/script.js"></script>
</body>

</html>
